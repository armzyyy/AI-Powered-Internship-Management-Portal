<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Internship Listings — InternHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-0:#0a0014;
    --ink-1:#10002b;
    --ink-2:#240046;
    --ink-3:#3c096c;
    --violet-1:#5a189a;
    --violet-2:#7b2cbf;
    --violet-3:#9d4edd;
    --lilac:#c77dff;
    --mist:#e0aaff;
    --text-hi:#f6ecff;
    --text-lo:#c3aee0;
    --line: rgba(224,170,255,0.14);
    --font-display:'Sora', sans-serif;
    --font-body:'Inter', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink-1);
    color:var(--text-hi);
    font-family:var(--font-body);
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--violet-2); color:#fff;}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--lilac);
    outline-offset:3px;
    border-radius:4px;
  }

  .bg-field{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60% 45% at 15% -5%, rgba(123,44,191,0.35), transparent 60%),
      radial-gradient(50% 40% at 100% 10%, rgba(90,24,154,0.30), transparent 60%),
      radial-gradient(70% 50% at 50% 100%, rgba(36,0,70,0.55), transparent 60%),
      var(--ink-1);
  }
  .bg-grid{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.35;
    background-image:
      linear-gradient(rgba(224,170,255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,170,255,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(65% 65% at 50% 20%, black, transparent 85%);
  }

  .logo{
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-display); font-weight:700; font-size:19px;
    letter-spacing:0.2px;
  }
  .logo-mark{
    width:30px;height:30px; border-radius:8px;
    background:linear-gradient(135deg, var(--violet-3), var(--lilac));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 18px rgba(157,78,221,0.55);
    flex-shrink:0;
  }
  .logo-mark svg{width:16px;height:16px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    padding:10px 20px; border-radius:9px; font-size:14px; font-weight:600;
    font-family:var(--font-body); cursor:pointer; border:1px solid transparent;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-ghost{color:var(--text-hi); border-color:var(--line); background:transparent;}
  .btn-ghost:hover{background:rgba(224,170,255,0.06);}
  .btn-solid{
    background:linear-gradient(135deg, var(--violet-2), var(--violet-3));
    color:#fff;
    box-shadow:0 8px 24px -8px rgba(123,44,191,0.7);
  }
  .btn-solid:hover{box-shadow:0 10px 28px -6px rgba(157,78,221,0.85);}
  .btn-solid:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
  .btn-sm{padding:8px 14px; font-size:13px; border-radius:8px;}

  /* ============================================================
     Dashboard layout (shared with student-dashboard.html)
     ============================================================ */
  .db-layout{
    position:relative; z-index:1;
    display:grid;
    grid-template-columns: 256px 1fr;
    min-height:100vh;
  }
  .db-sidebar{
    border-right:1px solid var(--line);
    background:rgba(16,0,43,0.55);
    backdrop-filter:blur(14px);
    padding:22px 18px;
    display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .db-sidebar-top{margin-bottom:30px;}
  .db-logo{padding:4px;}
  .db-nav{display:flex; flex-direction:column; gap:4px; flex:1;}
  .db-nav-item{
    display:flex; align-items:center; gap:12px;
    padding:11px 14px;
    border-radius:10px;
    background:none; border:none;
    color:var(--text-lo);
    font-family:var(--font-body);
    font-size:14px; font-weight:500;
    cursor:pointer;
    text-align:left;
    transition:background .2s, color .2s;
    width:100%;
  }
  .db-nav-item svg{width:17px; height:17px; flex-shrink:0;}
  .db-nav-item:hover{background:rgba(224,170,255,0.06); color:var(--text-hi);}
  .db-nav-item.active{
    background:linear-gradient(135deg, rgba(123,44,191,0.35), rgba(157,78,221,0.2));
    color:var(--text-hi);
    box-shadow:inset 0 0 0 1px rgba(199,125,255,0.3);
  }
  .db-back-link{
    display:flex; align-items:center; gap:10px;
    font-size:13.5px; color:var(--text-lo);
    padding:11px 14px;
    border-top:1px solid var(--line);
    margin-top:12px; padding-top:18px;
  }
  .db-back-link svg{width:16px; height:16px;}
  .db-back-link:hover{color:var(--text-hi);}

  .db-main{padding:34px 40px 60px;}

  .db-topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:28px; flex-wrap:wrap; gap:16px;
  }
  .db-eyebrow{
    font-size:12px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;
    color:var(--violet-3); margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .live-dot{width:6px;height:6px;border-radius:50%;background:#5eead4; box-shadow:0 0 8px #5eead4; display:inline-block;
    animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .db-title{font-family:var(--font-display); font-size:26px; font-weight:700;}
  .db-topbar-right{display:flex; align-items:center; gap:16px;}
  .db-avatar{
    width:40px; height:40px; border-radius:10px;
    background:linear-gradient(135deg, var(--violet-2), var(--violet-3));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:13px;
    color:#fff;
  }

  /* ---------------- Stat cards ---------------- */
  .db-stats-grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:16px;
    margin-bottom:24px;
  }
  .db-stat-card{
    background:rgba(60,9,108,0.35);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
  }
  .db-stat-label{font-size:12.5px; color:var(--text-lo); margin-bottom:10px;}
  .db-stat-value{font-family:var(--font-display); font-size:24px; font-weight:700; margin-bottom:6px;}
  .db-stat-hint{font-size:12px; color:var(--text-lo);}

  /* ---------------- Filter bar ---------------- */
  .filter-bar{
    background:rgba(60,9,108,0.28);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
    margin-bottom:22px;
  }
  .filter-search{
    flex:1 1 260px;
    display:flex; align-items:center; gap:10px;
    background:rgba(16,0,43,0.55);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
  }
  .filter-search svg{width:16px;height:16px; color:var(--text-lo); flex-shrink:0;}
  .filter-search input{
    background:none; border:none; outline:none; color:var(--text-hi);
    font-family:var(--font-body); font-size:14px; width:100%;
  }
  .filter-search input::placeholder{color:var(--text-lo);}
  .filter-select{
    background:rgba(16,0,43,0.55);
    border:1px solid var(--line);
    color:var(--text-hi);
    font-family:var(--font-body); font-size:13.5px; font-weight:500;
    padding:10px 12px; border-radius:10px; cursor:pointer;
  }
  .filter-select:hover{border-color:rgba(199,125,255,0.4);}
  .filter-count{font-size:13px; color:var(--text-lo); white-space:nowrap; margin-left:auto;}
  .filter-count strong{color:var(--text-hi);}

  /* ---------------- Listing grid ---------------- */
  .listing-grid{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;
  }
  .listing-card{
    background:rgba(60,9,108,0.28);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    display:flex; flex-direction:column; gap:14px;
    transition:border-color .2s, transform .2s, background .2s;
  }
  .listing-card:hover{
    border-color:rgba(199,125,255,0.4);
    transform:translateY(-3px);
    background:rgba(90,24,154,0.28);
  }
  .listing-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .listing-role{font-family:var(--font-display); font-size:16.5px; font-weight:600; margin-bottom:3px;}
  .listing-company{font-size:13.5px; color:var(--text-lo); display:flex; align-items:center; gap:6px;}
  .listing-avatar{
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(135deg, var(--violet-1), var(--violet-2));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--mist);
  }
  .type-pill{
    display:inline-flex; align-items:center;
    font-size:11px; font-weight:600;
    padding:4px 10px; border-radius:100px;
    white-space:nowrap; flex-shrink:0;
  }
  .type-pill.remote{background:rgba(52,211,153,0.16); color:#5eead4;}
  .type-pill.hybrid{background:rgba(157,78,221,0.2); color:var(--mist);}
  .type-pill.on-site{background:rgba(224,170,255,0.14); color:var(--lilac);}

  .listing-meta{display:flex; flex-wrap:wrap; gap:10px 18px; font-size:12.5px; color:var(--text-lo);}
  .listing-meta div{display:flex; align-items:center; gap:6px;}
  .listing-meta svg{width:14px;height:14px; color:var(--violet-3); flex-shrink:0;}
  .listing-desc{font-size:13px; color:var(--text-lo); line-height:1.55;}

  .listing-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .listing-tag{
    font-size:11px; font-weight:500; color:var(--text-lo);
    border:1px solid var(--line); padding:4px 9px; border-radius:100px;
  }

  .listing-footer{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding-top:14px; border-top:1px solid var(--line); margin-top:auto;
  }
  .listing-deadline{font-size:12px; color:var(--text-lo);}
  .listing-deadline strong{color:var(--text-hi); font-weight:600;}
  .listing-deadline.urgent strong{color:#fca5a5;}

  .empty-state, .loading-state, .error-state{
    grid-column:1 / -1;
    text-align:center;
    padding:60px 20px;
    color:var(--text-lo);
    background:rgba(60,9,108,0.2);
    border:1px dashed var(--line);
    border-radius:16px;
  }
  .empty-state h3, .error-state h3{font-family:var(--font-display); color:var(--text-hi); margin-bottom:8px; font-size:16px;}

  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid rgba(224,170,255,0.2); border-top-color:var(--violet-3);
    animation:spin 0.8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------------- Toast ---------------- */
  .toast{
    position:fixed; bottom:26px; right:26px; z-index:100;
    background:linear-gradient(135deg, var(--violet-2), var(--violet-3));
    color:#fff; font-size:13.5px; font-weight:600;
    padding:14px 20px; border-radius:12px;
    box-shadow:0 20px 40px -12px rgba(90,24,154,0.7);
    transform:translateY(20px); opacity:0; pointer-events:none;
    transition:transform .25s ease, opacity .25s ease;
  }
  .toast.show{transform:translateY(0); opacity:1;}

  /* ---------------- Responsive ---------------- */
  @media (max-width: 1080px){
    .db-stats-grid{grid-template-columns:repeat(2, 1fr);}
  }
  @media (max-width: 900px){
    .listing-grid{grid-template-columns:1fr;}
  }
  @media (max-width: 860px){
    .db-layout{grid-template-columns:1fr;}
    .db-sidebar{
      position:static; height:auto;
      flex-direction:row; align-items:center; justify-content:space-between;
      padding:14px 20px;
    }
    .db-sidebar-top{margin-bottom:0;}
    .db-nav{flex-direction:row; overflow-x:auto;}
    .db-nav-item span{display:none;}
    .db-back-link{display:none;}
    .db-main{padding:24px 20px 50px;}
  }
  @media (max-width: 560px){
    .db-stats-grid{grid-template-columns:1fr;}
    .filter-count{margin-left:0;}
  }
</style>
</head>
<body>

<div class="bg-field"></div>
<div class="bg-grid"></div>

<div class="db-layout">

  <!-- ---------------- Sidebar ---------------- -->
  <aside class="db-sidebar">
    <div class="db-sidebar-top">
      <a href="index.html" class="logo db-logo">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12l7-4 9 4-9 4-7-4z" stroke="#10002b" stroke-width="2" stroke-linejoin="round"/><path d="M8 14v4l3 2 3-2v-4" stroke="#10002b" stroke-width="2" stroke-linejoin="round"/></svg>
        </div>
        InternHub
      </a>
    </div>

    <nav class="db-nav">
      <a class="db-nav-item" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Overview</span>
      </a>
      <button class="db-nav-item active" data-tab="listings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Listings</span>
      </button>
      <a class="db-nav-item" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>
        <span>Applications</span>
      </a>
      <a class="db-nav-item" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>
        <span>Weekly Reports</span>
      </a>
      <a class="db-nav-item" href="student-dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </nav>

    <a href="index.html" class="db-back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to site
    </a>
  </aside>

  <!-- ---------------- Main ---------------- -->
  <main class="db-main">

    <div class="db-topbar">
      <div>
        <div class="db-eyebrow"><span class="live-dot"></span> Live listings</div>
        <h1 class="db-title">Internship Listings</h1>
      </div>
      <div class="db-topbar-right">
        <div class="db-avatar" title="Amina Rahman">AR</div>
      </div>
    </div>

    <!-- Stat cards -->
    <div class="db-stats-grid">
      <div class="db-stat-card">
        <div class="db-stat-label">Open Roles</div>
        <div class="db-stat-value" id="stat-total">—</div>
        <div class="db-stat-hint">Across all companies</div>
      </div>
      <div class="db-stat-card">
        <div class="db-stat-label">Companies Hiring</div>
        <div class="db-stat-value" id="stat-companies">—</div>
        <div class="db-stat-hint">Currently listed</div>
      </div>
      <div class="db-stat-card">
        <div class="db-stat-label">Remote Roles</div>
        <div class="db-stat-value" id="stat-remote">—</div>
        <div class="db-stat-hint">Work from anywhere</div>
      </div>
      <div class="db-stat-card">
        <div class="db-stat-label">Closing Soon</div>
        <div class="db-stat-value" id="stat-closing">—</div>
        <div class="db-stat-hint">Deadline within 7 days</div>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search-input" type="text" placeholder="Search by role, company, or skill…" autocomplete="off" />
      </div>
      <select id="filter-location" class="filter-select">
        <option value="all">All work types</option>
        <option value="remote">Remote</option>
        <option value="hybrid">Hybrid</option>
        <option value="on-site">On-site</option>
      </select>
      <select id="filter-sort" class="filter-select">
        <option value="newest">Newest first</option>
        <option value="deadline">Deadline soonest</option>
      </select>
      <div class="filter-count" id="result-count">Loading…</div>
    </div>

    <!-- Listings -->
    <div class="listing-grid" id="listing-grid">
      <div class="loading-state">
        <div class="spinner"></div>
        Fetching live internship listings…
      </div>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const API_BASE = '/api/internships';
  const grid = document.getElementById('listing-grid');
  const resultCount = document.getElementById('result-count');
  const searchInput = document.getElementById('search-input');
  const locationFilter = document.getElementById('filter-location');
  const sortFilter = document.getElementById('filter-sort');
  const toast = document.getElementById('toast');

  let debounceTimer = null;
  let allDataForStats = null;

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  function typeClass(type) {
    return type.toLowerCase().replace(/\s+/g, '-');
  }

  function initials(name) {
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function formatDeadline(deadline, daysLeft) {
    const d = new Date(deadline);
    const formatted = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    if (daysLeft < 0) return { text: 'Closed', urgent: true };
    if (daysLeft === 0) return { text: 'Closes today', urgent: true };
    if (daysLeft <= 7) return { text: `${daysLeft} day${daysLeft === 1 ? '' : 's'} left · ${formatted}`, urgent: true };
    return { text: `${daysLeft} days left · ${formatted}`, urgent: false };
  }

  function renderCards(results) {
    if (!results.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No internships match your filters</h3>
          <p>Try a different keyword or clear a filter to see more listings.</p>
        </div>`;
      return;
    }

    grid.innerHTML = results.map(item => {
      const deadline = formatDeadline(item.deadline, item.daysLeft);
      return `
        <div class="listing-card" data-id="${item.id}">
          <div class="listing-top">
            <div style="display:flex; gap:12px; align-items:flex-start;">
              <div class="listing-avatar">${initials(item.company)}</div>
              <div>
                <div class="listing-role">${item.role}</div>
                <div class="listing-company">${item.company}</div>
              </div>
            </div>
            <span class="type-pill ${typeClass(item.type)}">${item.type}</span>
          </div>

          <div class="listing-meta">
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              ${item.location}
            </div>
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              ${item.duration}
            </div>
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
              ${item.stipend}
            </div>
            <div>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
              ${item.openings} opening${item.openings === 1 ? '' : 's'}
            </div>
          </div>

          <p class="listing-desc">${item.description}</p>

          <div class="listing-tags">
            ${item.tags.map(t => `<span class="listing-tag">${t}</span>`).join('')}
          </div>

          <div class="listing-footer">
            <div class="listing-deadline ${deadline.urgent ? 'urgent' : ''}">
              Apply by <strong>${deadline.text}</strong>
            </div>
            <button class="btn btn-solid btn-sm apply-btn" data-id="${item.id}" data-role="${item.role}" data-company="${item.company}" ${item.daysLeft < 0 ? 'disabled' : ''}>
              ${item.daysLeft < 0 ? 'Closed' : 'Apply now'}
            </button>
          </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.apply-btn').forEach(btn => {
      btn.addEventListener('click', () => applyToInternship(btn));
    });
  }

  function updateStats(results) {
    // Stats reflect the full live dataset the first time it loads (not the filtered view)
    if (!allDataForStats) return;
    const total = allDataForStats.length;
    const companies = new Set(allDataForStats.map(i => i.company)).size;
    const remote = allDataForStats.filter(i => i.type.toLowerCase() === 'remote').length;
    const closing = allDataForStats.filter(i => i.daysLeft >= 0 && i.daysLeft <= 7).length;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-companies').textContent = companies;
    document.getElementById('stat-remote').textContent = remote;
    document.getElementById('stat-closing').textContent = closing;
  }

  async function applyToInternship(btn) {
    const id = btn.dataset.id;
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Submitting…';
    try {
      const res = await fetch(`${API_BASE}/${id}/apply`, { method: 'POST' });
      const data = await res.json();
      showToast(data.message || 'Application submitted.');
      btn.textContent = 'Applied ✓';
    } catch (err) {
      showToast('Something went wrong. Please try again.');
      btn.textContent = originalText;
      btn.disabled = false;
    }
  }

  async function fetchListings() {
    const params = new URLSearchParams();
    const search = searchInput.value.trim();
    const location = locationFilter.value;
    const sort = sortFilter.value;
    if (search) params.set('search', search);
    if (location !== 'all') params.set('location', location);
    if (sort) params.set('sort', sort);

    resultCount.textContent = 'Loading…';
    try {
      const res = await fetch(`${API_BASE}?${params.toString()}`);
      if (!res.ok) throw new Error('Request failed');
      const data = await res.json();

      if (!allDataForStats) {
        // capture the unfiltered dataset once for the stat cards
        const allRes = await fetch(API_BASE);
        const allJson = await allRes.json();
        allDataForStats = allJson.results;
        updateStats();
      }

      renderCards(data.results);
      resultCount.innerHTML = `<strong>${data.count}</strong> internship${data.count === 1 ? '' : 's'} found`;
    } catch (err) {
      console.error(err);
      grid.innerHTML = `
        <div class="error-state">
          <h3>Couldn't load listings</h3>
          <p>Make sure the InternHub server is running, then refresh the page.</p>
        </div>`;
      resultCount.textContent = '';
    }
  }

  searchInput.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(fetchListings, 300);
  });
  locationFilter.addEventListener('change', fetchListings);
  sortFilter.addEventListener('change', fetchListings);

  fetchListings();
</script>

</body>
</html>
