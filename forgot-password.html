<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — InternHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/core.css">
</head>
<body>
<div class="bg-field"></div>
<div class="bg-grid"></div>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l7-4 9 4-9 4-7-4z" stroke="#10002b" stroke-width="2" stroke-linejoin="round"/></svg></div>
      InternHub
    </a>
    <a href="login.html" class="btn btn-ghost btn-sm">Back to login</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card" id="request-step">
    <h1 class="auth-title">Reset your password</h1>
    <p class="auth-sub">Enter the email on your account and we'll send a reset link</p>

    <form id="forgot-form" novalidate>
      <div class="form-group" id="group-email">
        <label class="form-label" for="fp-email">Email</label>
        <input class="form-input" type="email" id="fp-email" placeholder="you@nsu.edu.bd" required />
        <div class="form-error" id="error-email">Enter a valid email address.</div>
      </div>
      <button type="submit" class="btn btn-solid btn-lg btn-block" id="submit-btn">Send reset link</button>
    </form>
    <div class="auth-footer-link">Remembered it? <a href="login.html">Log in</a></div>
  </div>

  <div class="auth-card" id="sent-step" style="display:none; text-align:center;">
    <div class="logo-mark" style="width:52px;height:52px;border-radius:14px; margin:0 auto 18px;">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10002b" stroke-width="2" style="width:26px;height:26px;"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1 class="auth-title">Check your inbox</h1>
    <p class="auth-sub">We've sent a password reset link to <strong id="sent-email" style="color:var(--text-hi);"></strong>. The link expires in 30 minutes.</p>
    <button class="btn btn-ghost btn-lg btn-block" id="resend-btn">Resend email</button>
    <div class="auth-footer-link"><a href="login.html">Back to login</a></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }

  document.getElementById('forgot-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const email = document.getElementById('fp-email').value.trim();
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    document.getElementById('group-email').classList.toggle('invalid', !emailValid);
    document.getElementById('error-email').classList.toggle('show', !emailValid);
    if (!emailValid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      // POST /api/auth/forgot-password { email }
      await fetch('/api/auth/forgot-password', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ email })
      });
      document.getElementById('sent-email').textContent = email;
      document.getElementById('request-step').style.display = 'none';
      document.getElementById('sent-step').style.display = 'block';
    } catch (err) {
      showToast('Something went wrong. Please try again.');
      btn.disabled = false; btn.textContent = 'Send reset link';
    }
  });

  document.getElementById('resend-btn').addEventListener('click', () => showToast('Reset link resent.'));
</script>
</body>
</html>
