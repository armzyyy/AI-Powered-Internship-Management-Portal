kind = "web"
previewPath = "/"
title = "InternHub"
version = "1.0.0"
id = "artifacts/internhub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20261

[services.development]
run = "pnpm --filter @workspace/internhub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/internhub", "run", "build" ]
serve = "static"
publicDir = "artifacts/internhub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20261"
BASE_PATH = "/"
