<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create account — InternHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/core.css">
</head>
<body>
<div class="bg-field"></div>
<div class="bg-grid"></div>

<header class="topnav">
  <div class="topnav-inner">
    <a href="index.html" class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12l7-4 9 4-9 4-7-4z" stroke="#10002b" stroke-width="2" stroke-linejoin="round"/></svg></div>
      InternHub
    </a>
    <a href="login.html" class="btn btn-ghost btn-sm">Log in</a>
  </div>
</header>

<main class="auth-wrap">
  <div class="auth-card" style="max-width:500px;">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Pick your role — you'll only see the tools that matter to you</p>

    <div class="role-tabs" id="role-tabs">
      <div class="role-tab active" data-role="student">Student</div>
      <div class="role-tab" data-role="faculty">Faculty</div>
      <div class="role-tab" data-role="company">Company</div>
      <div class="role-tab" data-role="admin">Admin</div>
    </div>

    <form id="register-form" novalidate>
      <div class="form-row-2">
        <div class="form-group" id="group-fname">
          <label class="form-label" for="fname">Full name</label>
          <input class="form-input" type="text" id="fname" placeholder="e.g. Nusrat Jahan" required />
          <div class="form-error" id="error-fname">Enter your full name.</div>
        </div>
        <div class="form-group" id="group-university" data-role-field="student,faculty">
          <label class="form-label" for="university">University</label>
          <select class="form-select" id="university">
            <option>North South University</option>
            <option>BRAC University</option>
            <option>Independent University, Bangladesh</option>
            <option>American International University-Bangladesh</option>
            <option>East West University</option>
            <option>United International University</option>
            <option>Ahsanullah University of Science and Technology</option>
          </select>
        </div>
        <div class="form-group" id="group-company" data-role-field="company" style="display:none;">
          <label class="form-label" for="company-name">Company name</label>
          <input class="form-input" type="text" id="company-name" placeholder="e.g. Nexora Labs" />
        </div>
      </div>

      <div class="form-group" id="group-email">
        <label class="form-label" for="reg-email">Email</label>
        <input class="form-input" type="email" id="reg-email" placeholder="you@example.com" autocomplete="username" required />
        <div class="form-error" id="error-email">Enter a valid email address.</div>
      </div>

      <div class="form-group" id="group-id" data-role-field="student">
        <label class="form-label" for="student-id">Student ID</label>
        <input class="form-input" type="text" id="student-id" placeholder="e.g. 2211xxxxx" />
      </div>

      <div class="form-row-2">
        <div class="form-group" id="group-password">
          <label class="form-label" for="reg-password">Password</label>
          <input class="form-input" type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
          <div class="form-error" id="error-password">Must be at least 8 characters.</div>
        </div>
        <div class="form-group" id="group-confirm">
          <label class="form-label" for="reg-confirm">Confirm password</label>
          <input class="form-input" type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password" required />
          <div class="form-error" id="error-confirm">Passwords don't match.</div>
        </div>
      </div>

      <label class="form-check" style="margin-bottom:22px;">
        <input type="checkbox" id="terms" required /> I agree to the Terms of Service and Privacy Policy
      </label>

      <button type="submit" class="btn btn-solid btn-lg btn-block" id="submit-btn">Create account</button>
    </form>

    <div class="auth-footer-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  const roleTabs = document.querySelectorAll('.role-tab');
  let selectedRole = 'student';
  function applyRoleFields(){
    document.querySelectorAll('[data-role-field]').forEach(el => {
      const roles = el.dataset.roleField.split(',');
      el.style.display = roles.includes(selectedRole) ? '' : 'none';
    });
  }
  roleTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      roleTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      selectedRole = tab.dataset.role;
      applyRoleFields();
    });
  });
  applyRoleFields();

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2600);
  }
  function setInvalid(groupId, errorId, isInvalid){
    document.getElementById(groupId).classList.toggle('invalid', isInvalid);
    document.getElementById(errorId).classList.toggle('show', isInvalid);
  }

  document.getElementById('register-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const fname = document.getElementById('fname').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pw = document.getElementById('reg-password').value;
    const confirm = document.getElementById('reg-confirm').value;

    const nameValid = fname.length > 1;
    const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    const pwValid = pw.length >= 8;
    const confirmValid = pw === confirm && confirm.length > 0;

    setInvalid('group-fname', 'error-fname', !nameValid);
    setInvalid('group-email', 'error-email', !emailValid);
    setInvalid('group-password', 'error-password', !pwValid);
    setInvalid('group-confirm', 'error-confirm', !confirmValid);
    if (!nameValid || !emailValid || !pwValid || !confirmValid) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      // POST /api/auth/register { role, fullName, email, password, universityOrCompany, studentId }
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ role: selectedRole, fullName: fname, email, password: pw })
      });
      if (!res.ok) { const d = await res.json().catch(()=>({})); throw new Error(d.message || 'Registration failed'); }
      showToast('Account created — redirecting to login…');
      setTimeout(() => { window.location.href = 'login.html'; }, 900);
    } catch (err) {
      showToast(err.message || 'Something went wrong.');
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
